# Vendored modules registry
#
# This file is a DOCUMENTATION REGISTRY only. It is not consumed by the
# build — the build globs src/modules/* and exposes a BUILD_MODULE_<NAME>
# flag per directory (see src/modules/modules/CMakeLists.txt). Use this
# file to track upstream provenance for vendored modules so contributors
# know where to look for upstream fixes to cherry-pick.
#
# Format: NAME=URL (one per line; comments with #).
#
# All modules below are vendored into src/modules/ — they do not need to
# be cloned at build time. Each module's NOTES.md records the upstream
# SHA at import and the import date.

# Vendored from external upstreams (cherry-pick fixes from these repos)
ACHIEVEMENTS=https://github.com/flekz-games/cmangos-achievements
BARBER=https://github.com/celguar/cmangos-barber
DUALSPEC=https://github.com/flekz-games/cmangos-dualspec
TRAININGDUMMIES=https://github.com/flekz-games/cmangos-trainingdummies
TRANSMOG=https://github.com/flekz-games/cmangos-transmog

# Vendored from Emberstone-maintained forks (track xunholy/* repos)
ATTUNEMENT=https://github.com/xunholy/cmangos-attunement
TWINKMASTER=https://github.com/xunholy/cmangos-twinkmaster

# Originated in this fork — no separate upstream repo
AUTOSCALE=in-tree
VIP=in-tree

# Framework module (the cmangos-modules system itself)
MODULES=https://github.com/flekz-games/cmangos-modules
