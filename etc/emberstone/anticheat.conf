# session that aren't expected.
Movement.Teleport.TickCount          = 1
Movement.Teleport.TickAction         = 3
Movement.Teleport.TotalCount         = 3
Movement.Teleport.TotalAction        = 7

Movement.TeleportFar.TickCount       = 1
Movement.TeleportFar.TickAction      = 3
Movement.TeleportFar.TotalCount      = 3
Movement.TeleportFar.TotalAction     = 7

# Exploration anomaly checks — informational. Don't kick someone for
# walking into a high-level zone they shouldn't have found yet.
Movement.Explore.TickCount      = 3
Movement.Explore.TickAction     = 3
Movement.Explore.TotalCount     = 0
Movement.Explore.TotalAction    = 0

Movement.ExploreHigh.TickCount  = 1
Movement.ExploreHigh.TickAction = 3
Movement.ExploreHigh.TotalCount  = 0
Movement.ExploreHigh.TotalAction = 0

# BadFallReset uses a different schema (Threshold + single Penalty).
Movement.BadFallReset.Enable    = 1
Movement.BadFallReset.Threshold = 1
Movement.BadFallReset.Penalty   = 7

################################
# Anti-spam (chat)
################################
Antispam.Enable   = 1
# Auto-silence (reversible) instead of letting spambots flood. Mute, don't ban.
Antispam.Silence  = 1
Antispam.MaxLevel = 25

################################
# Warden (Blizzard client memory inspection)
################################
Warden.Enable                       = 1
Warden.ModuleDir                    = "warden_modules"
Warden.Timeout                      = 30
Warden.ScanFrequency                = 15
Warden.ScanCount                    = 10
# Default was 25 — that lets cheaters skate on lowbie alts. Cover everyone.
Warden.MinimumLevel                 = 1
Warden.MinimumAdvancedLevel         = 1
# Warden detections are very specific (memory signature match) — kick is correct.
Warden.SuspiciousEndSceneHookAction = 7
Warden.TickCount                    = 1
Warden.TickAction                   = 7
Warden.TotalCount                   = 0
Warden.TotalAction                  = 0
