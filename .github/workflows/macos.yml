name: macOS Build

# Manual-only. macOS runners bill at 10x and this fork ships Linux/Docker
# only, so we don't run macOS on every push — trigger it on demand when a
# macOS-portability check is actually wanted.
on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  REPO_DIR : ${{github.workspace}}
  BUILD_DIR: ${{github.workspace}}/bin/builddir

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: ${{env.REPO_DIR}}

      - name: Install Dependencies
        run: |
          brew install mysql-client@8.4
          brew install openssl
          brew install boost@1.85
          brew link boost@1.85
          # icu4c is keg-only on macOS — boost.locale and mysql-client both
          # transitively link libicudata.dylib at link time. Brew puts icu4c
          # under its own prefix and does NOT add it to the default link path,
          # so previously the realmd link step failed with "ld: library
          # 'icudata' not found". Force-link makes `-licudata` resolvable
          # without per-step LDFLAGS, and we also export LDFLAGS / CPPFLAGS
          # in the Configure step as belt-and-braces in case a future brew
          # change tightens keg-only enforcement.
          brew install icu4c
          brew link icu4c --force
          echo "OPENSSL_ROOT_DIR=$(brew --prefix --installed openssl)" >> $GITHUB_ENV
          echo "ICU_ROOT=$(brew --prefix --installed icu4c)" >> $GITHUB_ENV

      - name: Configure
        env:
          BOOST_ROOT: /opt/homebrew/opt/boost
          # CMAKE_PREFIX_PATH covers find_package; LDFLAGS / CPPFLAGS cover
          # link-time / compile-time resolution for transitive deps (icudata
          # via boost.locale + mysql-client).
          CMAKE_PREFIX_PATH: ${{env.ICU_ROOT}}:/opt/homebrew
          LDFLAGS: -L${{env.ICU_ROOT}}/lib
          CPPFLAGS: -I${{env.ICU_ROOT}}/include
        run: cmake -B ${{env.BUILD_DIR}} -S ${{env.REPO_DIR}} -DBoost_ARCHITECTURE=-arm64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        env:
          MAKEFLAGS: "-j8"
        run: cmake --build ${{env.BUILD_DIR}} --config ${{env.BUILD_TYPE}}
