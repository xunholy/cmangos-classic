---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Build CMaNGOS Classic (Emberstone)"

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  # Build PR images so changes can be deployed to PTR for soak testing
  # before merging to main. Images are tagged with the merge-commit SHA
  # (github.sha on a pull_request event), which the GitHub UI surfaces
  # alongside each PR head — the k8s-gitops side pins to that SHA.
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

permissions: write-all

env:
  BUILDER_IMAGE: ghcr.io/xunholy/cmangos-classic-builder
  RUNNER_IMAGE: ghcr.io/xunholy/cmangos-classic

jobs:
  build-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # Persist the ccache state across GHA runs. actions/cache is
      # branch-scoped (main caches are restorable from any branch;
      # PR caches are PR-private). buildkit-cache-dance plumbs that
      # cache into the `--mount=type=cache,id=cmangos-ccache` mount
      # used by the cmake/make RUN in Dockerfile's builder stage —
      # without this dance, BuildKit cache mounts are local to the
      # GHA runner VM and lost between runs.
      - name: Restore ccache state
        id: ccache
        uses: actions/cache@v6
        with:
          path: cache-mount
          key: cmangos-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cmangos-ccache-${{ runner.os }}-

      - name: Inject ccache into buildkit cache mount
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cache-mount": "/root/.ccache"
            }
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}

      - name: Build and push builder
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: builder
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE }}:${{ github.sha }}
            ${{ env.BUILDER_IMAGE }}:latest
          build-args: |
            THREADS=4
            COMMIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=builder
            type=registry,ref=${{ env.BUILDER_IMAGE }}:latest
          cache-to: type=gha,mode=max,scope=builder

      # Image provenance: sign the pushed digest with cosign keyless
      # (OIDC via the GitHub Actions token, no key material to manage).
      # Cluster-side verification is NOT enforced yet — this just
      # establishes signatures on GHCR so we can flip on Kyverno
      # verifyImages later without backfilling history.
      - name: Install cosign
        uses: sigstore/cosign-installer@main

      - name: Sign builder image
        env:
          IMAGE: ${{ env.BUILDER_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

  build-runner:
    runs-on: ubuntu-latest
    needs: build-builder
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push runner
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.RUNNER_IMAGE }}:${{ github.sha }}
            ${{ env.RUNNER_IMAGE }}:latest
          build-args: |
            THREADS=4
            COMMIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=builder
            type=gha,scope=runner
            type=registry,ref=${{ env.RUNNER_IMAGE }}:latest
          cache-to: type=gha,mode=max,scope=runner

      - name: Install cosign
        uses: sigstore/cosign-installer@main

      - name: Sign runner image
        env:
          IMAGE: ${{ env.RUNNER_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

  # ─── AddressSanitizer variant ────────────────────────────────────────────
  # Produces `:asan-<sha>` and `:asan-latest` images. ~2× slower than the
  # Release build at runtime; intended for PTR-side soak to catch UAF /
  # heap-corruption in playerbots SQL pathways. Skips PRs (cold ASan
  # builds are 60-90 min) — only runs on push to main and on
  # workflow_dispatch.
  build-builder-asan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # Separate ccache scope from the Release build — ASan object files
      # carry different `-f` flags so they're not interchangeable cache
      # entries.
      - name: Restore ccache state (asan)
        id: ccache-asan
        uses: actions/cache@v6
        with:
          path: cache-mount-asan
          key: cmangos-ccache-asan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            cmangos-ccache-asan-${{ runner.os }}-

      - name: Inject ccache (asan) into buildkit cache mount
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "cache-mount-asan": "/root/.ccache"
            }
          skip-extraction: ${{ steps.ccache-asan.outputs.cache-hit }}

      - name: Build and push builder (asan)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: builder
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE }}:asan-${{ github.sha }}
            ${{ env.BUILDER_IMAGE }}:asan-latest
          build-args: |
            THREADS=4
            SANITIZER=address
            COMMIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=builder-asan
            type=registry,ref=${{ env.BUILDER_IMAGE }}:asan-latest
          cache-to: type=gha,mode=max,scope=builder-asan

      - name: Install cosign
        uses: sigstore/cosign-installer@main

      - name: Sign builder image (asan)
        env:
          IMAGE: ${{ env.BUILDER_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

  build-runner-asan:
    runs-on: ubuntu-latest
    needs: build-builder-asan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build and push runner (asan)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.RUNNER_IMAGE }}:asan-${{ github.sha }}
            ${{ env.RUNNER_IMAGE }}:asan-latest
          build-args: |
            THREADS=4
            SANITIZER=address
            COMMIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=builder-asan
            type=gha,scope=runner-asan
            type=registry,ref=${{ env.RUNNER_IMAGE }}:asan-latest
          cache-to: type=gha,mode=max,scope=runner-asan

      - name: Install cosign
        uses: sigstore/cosign-installer@main

      - name: Sign runner image (asan)
        env:
          IMAGE: ${{ env.RUNNER_IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
